<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3a0d6e"/>
      <stop offset="100%" stop-color="#0d001f"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="20%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#e91e8c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e91e8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="240" cy="380" rx="480" ry="300" fill="url(#glowLeft)"/>
  <ellipse cx="1020" cy="285" rx="420" ry="260" fill="url(#glowRight)"/>

  <!-- Decorative horizontal lines -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="0" y1="530" x2="1200" y2="530" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Top accent bar -->
  <rect x="80" y="80" width="120" height="4" rx="2" fill="#e91e8c"/>

  <!-- Gold star cluster top-right -->
  <!-- Main star -->
  <polygon points="1080,60 1086,80 1107,80 1091,93 1097,113 1080,100 1063,113 1069,93 1053,80 1074,80"
           fill="#d4890f" opacity="0.95"/>
  <!-- Small star -->
  <polygon points="1115,90 1118,99 1128,99 1120,105 1123,114 1115,108 1107,114 1110,105 1102,99 1112,99"
           fill="#d4890f" opacity="0.7"/>
  <!-- Tiny star -->
  <polygon points="1048,95 1050,101 1057,101 1051,105 1053,111 1048,107 1043,111 1045,105 1039,101 1046,101"
           fill="#d4890f" opacity="0.5"/>

  <!-- MK large monogram -->
  <text x="80" y="360"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="220"
        letter-spacing="-8"
        fill="#ffffff"
        fill-opacity="0.08">MK</text>

  <!-- Business name -->
  <text x="80" y="290"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="82"
        letter-spacing="-2"
        fill="#ffffff"
        filter="url(#textGlow)">MK PUB</text>
  <text x="80" y="385"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="82"
        letter-spacing="-2"
        fill="#e91e8c"
        filter="url(#textGlow)">ENTERTAINMENT</text>

  <!-- Magenta underline -->
  <rect x="80" y="403" width="760" height="5" rx="2.5" fill="#e91e8c" opacity="0.6"/>

  <!-- Tagline -->
  <text x="80" y="460"
        font-family="Arial, sans-serif"
        font-size="30"
        fill="#ffffff"
        fill-opacity="0.75"
        letter-spacing="3">PUB QUIZZES · KARAOKE · BOP-ALONG BINGO · CORPORATE EVENTS</text>

  <!-- Service pills -->
  <rect x="80" y="490" width="160" height="40" rx="20" fill="#e91e8c" fill-opacity="0.2" stroke="#e91e8c" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="160" y="516" font-family="Arial, sans-serif" font-size="15" fill="#e91e8c" text-anchor="middle" font-weight="700">PUB QUIZ</text>

  <rect x="252" y="490" width="150" height="40" rx="20" fill="#e91e8c" fill-opacity="0.2" stroke="#e91e8c" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="327" y="516" font-family="Arial, sans-serif" font-size="15" fill="#e91e8c" text-anchor="middle" font-weight="700">KARAOKE</text>

  <rect x="414" y="490" width="190" height="40" rx="20" fill="#e91e8c" fill-opacity="0.2" stroke="#e91e8c" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="509" y="516" font-family="Arial, sans-serif" font-size="15" fill="#e91e8c" text-anchor="middle" font-weight="700">BINGO BINGO</text>

  <rect x="616" y="490" width="200" height="40" rx="20" fill="#e91e8c" fill-opacity="0.2" stroke="#e91e8c" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="716" y="516" font-family="Arial, sans-serif" font-size="15" fill="#e91e8c" text-anchor="middle" font-weight="700">CORPORATE</text>

  <!-- Right side: phone CTA -->
  <text x="1120" y="490"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="22"
        fill="#ffffff"
        fill-opacity="0.9"
        text-anchor="end">07783 913220</text>
  <text x="1120" y="518"
        font-family="Arial, sans-serif"
        font-size="16"
        fill="#e91e8c"
        text-anchor="end"
        letter-spacing="2">BOOK NOW</text>

  <!-- Bottom accent bar -->
  <rect x="80" y="556" width="1040" height="2" rx="1" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="80" y="558" width="200" height="2" rx="1" fill="#e91e8c" fill-opacity="0.5"/>
</svg>
